import org.gradle.internal.os.OperatingSystem

plugins {
    alias(libs.plugins.android.library)
    id("de.undercouch.download") version "5.6.0"
    id 'maven-publish'
    id 'signing'
}

group = 'com.github.dalgarins'

android {
    namespace 'org.spatialite'
    compileSdk 34
    ndkVersion '27.3.13750724'

    defaultConfig {
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            ndkBuild {
                arguments "-j8", "V=1"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }

    sourceSets.main.jni.srcDirs = ['src/main/none']

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
}

ext {
    sqliteDistributionUrl = 'https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip'
}

tasks.register('downloadSqlite', Download) {
    src project.sqliteDistributionUrl
    dest 'src/main/jni/ndk-modules/sqlite/sqlite.zip'
}

tasks.register('installSqlite', Copy) {
    dependsOn downloadSqlite
    from zipTree(downloadSqlite.dest).matching {
        include '*/sqlite3.*'
        eachFile { it.setPath(it.getName()) }
    }
    into 'src/main/jni/ndk-modules/sqlite'
}

preBuild.dependsOn installSqlite

dependencies {

    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'io.github.ev-map'
            artifactId = 'android-spatialite'

            version = '2.2.1-alpha'

            pom {
                name = "android-spatialite"
                description = "The Spatialite database ported for Android"
                url = "https://github.com/ev-map/android-spatialite"
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/ev-map/android-spatialite.git'
                    developerConnection = 'scm:git:ssh://git@github.com/ev-map/android-spatialite.git'
                    url = 'https://github.com/ev-map/android-spatialite'
                }
                developers {
                    developer {
                        name = 'Johan von Forstner'
                        email = 'evmap@vonforst.net'
                        organization = "EVMap"
                        organizationUrl = "https://ev-map.app"
                    }
                }
            }

            afterEvaluate {
                from components.release
            }
        }
    }
    repositories {
        maven {
            url = uri(layout.buildDirectory.dir("repos/releases"))
        }
    }
}

signing {
    sign publishing.publications.release
}